# Small Llama-style model (RMSNorm, RoPE, GQA, SwiGLU) on "The Verdict".
model:
  preset: llama-tiny
  context_length: 256

data:
  data_dir: data/verdict
  num_workers: 0

train:
  out_dir: runs/llama_tiny_verdict
  batch_size: 2
  epochs: 10
  lr: 1.0e-3
  warmup_steps: 2
  lr_schedule: cosine
  eval_every: 5
  sample_every: 10
